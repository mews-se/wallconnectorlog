name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile
        run: python -m compileall -q wallconnectorlog.py tests

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Session derivation test
        run: python tests/test_session.py

      - name: Backup and restore test
        run: python tests/test_backup.py

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: |
          docker build -t wallconnectorlog:ci .
          docker build -t wallconnectorlog-grafana:ci grafana
      # No mkdir first: the bind-mount directory must work even when Docker
      # creates it owned by root, which is what a bare compose start gets.
      - name: Logger starts and serves
        run: |
          docker run -d --name wcl -e WC_HOST=127.0.0.1:1 -v "$PWD/ci-data:/data" \
            -p 4680:4680 wallconnectorlog:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4680/ || true)
            [ "$code" = "200" ] && echo "serving" && exit 0
            sleep 2
          done
          docker logs wcl
          exit 1
      - name: Grafana serves the provisioned dashboard without login
        run: |
          docker run -d --name wclg -p 3399:3000 wallconnectorlog-grafana:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3399/api/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3399/api/health
          # Anonymous search must list the provisioned dashboard
          curl -sf http://127.0.0.1:3399/api/search | grep -q WallConnectorLog \
            || { docker logs wclg; exit 1; }
