name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Weekly rebuild so latest picks up new Grafana releases and base image
    # security updates without a code change.
    - cron: "20 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Docker Hub mirroring activates itself once the two secrets exist
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            # Not type=semver: it silently drops two-part tags like v1.0,
            # leaving the build with no tags at all.
            type=match,pattern=v(.*),group=1

      - uses: docker/metadata-action@v5
        id: metagrafana
        with:
          images: ghcr.io/${{ github.repository }}-grafana
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: docker/build-push-action@v6
        with:
          context: grafana
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metagrafana.outputs.tags }}
          labels: ${{ steps.metagrafana.outputs.labels }}

      - name: Mirror to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        env:
          TAGS: >-
            ${{ steps.meta.outputs.tags }}
            ${{ steps.metagrafana.outputs.tags }}
        run: |
          set -eu
          sudo apt-get update -q
          sudo apt-get install -yq skopeo
          # Trim whitespace/CR that easily sneaks in when secrets are pasted
          hub_user="$(printf %s '${{ secrets.DOCKERHUB_USERNAME }}' | tr -d '[:space:]')"
          printf %s '${{ secrets.DOCKERHUB_TOKEN }}' | tr -d '[:space:]' | \
              skopeo login -u "$hub_user" --password-stdin docker.io
          for ref in $TAGS; do
              name="${ref%:*}"; name="${name##*/}"
              tag="${ref##*:}"
              skopeo copy --all "docker://$ref" \
                  "docker://docker.io/${hub_user}/${name}:$tag"
          done
